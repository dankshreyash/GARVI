    <rect x="75" y="4" width="105" height="16" rx="8" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="0.8"/>
    <circle cx="84" cy="12" r="3" fill="#059669"/>
    <text x="91" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#065F46">VERIFIED ON GARVI</text>
