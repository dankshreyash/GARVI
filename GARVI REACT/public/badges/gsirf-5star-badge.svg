  <text x="80" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#78350F">5-STAR RATED INSTITUTION</text>

  <!-- Stars Row + Verified Pill -->
  <g transform="translate(80, 52)">
