    <path d="M14 2 L2 7 C2 19 8 28 14 31 C20 28 26 19 26 7 Z" fill="#D97706" fill-opacity="0.15" stroke="#B45309" stroke-width="1.5"/>
    <path d="M8 16 L12 20 L20 11" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
