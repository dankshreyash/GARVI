  <path d="M42 24 L45.7 35.4 L57.7 35.4 L48 42.4 L51.7 53.8 L42 46.8 L32.3 53.8 L36 42.4 L26.3 35.4 L38.3 35.4 Z" fill="#D97706"/>

  <!-- Text Hierarchy -->
